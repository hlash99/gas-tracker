name: refresh

# Weekly refresh of EIA's San Francisco gas prices (EIA posts Mondays). Rebuilds data.json
# from fills.json; new fills from Monarch are added to fills.json by hand.
on:
  schedule:
    - cron: '17 15 * * 2'   # Tue 15:17 UTC (~08:17 PT)
  workflow_dispatch: {}      # also lets the dashboard ↻ button trigger it
  push:
    paths: ['fills.json']    # rebuild whenever fills are added

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild data.json (EIA prices + fills)
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "refresh: EIA prices $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main || { git rebase --abort || true; exit 0; }
            done
          else
            echo "no change"
          fi
